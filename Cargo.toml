[package]
name = "balatro-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio", "svg", "image"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
which = "7.0"
futures-util = "0.3"
tempfile = "3.17"
tar = "0.4"
flate2 = "1.0"
zip = "2.2"
