name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libasound2-dev libgl1-mesa-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package Linux artifact
        run: |
          mkdir -p dist
          cp target/release/balatro-launcher dist/balatro-launcher-linux-x86_64
          tar -czvf dist/balatro-launcher-linux-x86_64.tar.gz -C target/release balatro-launcher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: balatro-launcher-linux-x86_64
          path: dist/balatro-launcher-linux-x86_64.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/balatro-launcher-linux-x86_64
            dist/balatro-launcher-linux-x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
